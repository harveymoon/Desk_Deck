<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0a0c"/>
  <!-- Sharp grid of widgets — uneven sizes evoking the free-layout canvas. -->
  <!-- Row 1 -->
  <rect x="56"  y="56"  width="160" height="120" fill="none" stroke="#2a2a32" stroke-width="6"/>
  <rect x="232" y="56"  width="100" height="120" fill="none" stroke="#2a2a32" stroke-width="6"/>
  <rect x="348" y="56"  width="108" height="120" fill="#5cf" stroke="#5cf" stroke-width="6"/>
  <!-- Row 2 (slider) -->
  <rect x="56"  y="192" width="276" height="48"  fill="none" stroke="#2a2a32" stroke-width="6"/>
  <rect x="68"  y="208" width="120" height="16"  fill="#5cf"/>
  <rect x="348" y="192" width="108" height="48"  fill="none" stroke="#2a2a32" stroke-width="6"/>
  <!-- Row 3 (textbox lines) -->
  <rect x="56"  y="256" width="400" height="200" fill="none" stroke="#2a2a32" stroke-width="6"/>
  <rect x="76"  y="278" width="280" height="10" fill="#3a3a45"/>
  <rect x="76"  y="304" width="220" height="10" fill="#3a3a45"/>
  <rect x="76"  y="330" width="320" height="10" fill="#3a3a45"/>
  <rect x="76"  y="356" width="180" height="10" fill="#3a3a45"/>
  <rect x="76"  y="382" width="260" height="10" fill="#3a3a45"/>
  <rect x="76"  y="408" width="200" height="10" fill="#3a3a45"/>
</svg>
