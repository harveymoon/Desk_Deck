<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable-safe: all key content within the 80% safe zone (51..461). -->
  <rect width="512" height="512" fill="#0a0a0c"/>

  <!-- 3x3 grid of bold cells (suggesting a deck of buttons). Top-left filled cyan. -->
  <g stroke="#5a5a68" stroke-width="6" fill="none">
    <!-- outer frame -->
    <rect x="80" y="80" width="352" height="352"/>
    <!-- vertical grid lines -->
    <line x1="197.3" y1="80" x2="197.3" y2="432"/>
    <line x1="314.7" y1="80" x2="314.7" y2="432"/>
    <!-- horizontal grid lines -->
    <line x1="80" y1="197.3" x2="432" y2="197.3"/>
    <line x1="80" y1="314.7" x2="432" y2="314.7"/>
  </g>

  <!-- Active cell, top-left -->
  <rect x="83" y="83" width="111.3" height="111.3" fill="#5cf"/>

  <!-- Slider hint in bottom row -->
  <rect x="86" y="318" width="92" height="20" fill="#5cf"/>

  <!-- Center "needle" dot to suggest a rotary -->
  <circle cx="256" cy="256" r="20" fill="none" stroke="#5cf" stroke-width="6"/>
  <line x1="256" y1="256" x2="256" y2="232" stroke="#5cf" stroke-width="6"/>
</svg>
