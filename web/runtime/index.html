<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk Deck">
<meta name="theme-color" content="#0a0a0c">
<title>Desk Deck</title>

<link rel="manifest" href="/runtime-static/manifest.webmanifest">
<link rel="icon" href="/runtime-static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/runtime-static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/runtime-static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/runtime-static/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/runtime-static/apple-touch-icon.png">

<link rel="stylesheet" href="/runtime-static/runtime.css">
</head>
<body>
  <header class="dd-titlebar" id="titlebar">
    <div class="dd-tb-text">
      <div class="dd-tb-name" id="tb-name">—</div>
      <div class="dd-tb-sub"  id="tb-sub"></div>
    </div>
    <div class="dd-tb-meta">
      <span class="dd-tb-source" id="tb-source"></span>
    </div>
  </header>

  <aside class="dd-sidebar" id="sidebar">
    <button class="dd-sb-menu" data-overlay="apps" title="All Apps">
      <span class="dd-sb-glyph">▦</span><span class="dd-sb-lbl">Apps</span>
    </button>
    <button class="dd-sb-menu" data-overlay="winri" title="Winri tiling controller">
      <span class="dd-sb-glyph">⊞</span><span class="dd-sb-lbl">Winri</span>
    </button>
    <button class="dd-sb-menu" data-overlay="bookmarks" title="Bookmarks">
      <span class="dd-sb-glyph">★</span><span class="dd-sb-lbl">Marks</span>
    </button>
    <div class="dd-sb-spacer"></div>
    <div class="dd-sb-status" id="sb-status" title="offline">
      <span class="dd-sb-dot"></span>
      <span class="dd-sb-status-lbl" id="sb-status-lbl">offline</span>
    </div>
  </aside>

  <main id="stage" class="dd-stage"></main>

  <div id="overlay" class="dd-overlay" hidden>
    <div class="dd-overlay-head">
      <button class="dd-back-btn" id="overlay-back" hidden title="Back">←</button>
      <span id="overlay-title">—</span>
      <button class="dd-overlay-close" id="overlay-close">×</button>
    </div>
    <div class="dd-overlay-body" id="overlay-body"></div>
  </div>

  <script type="module" src="/runtime-static/runtime.js"></script>
</body>
</html>
