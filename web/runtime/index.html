<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk Deck">
<meta name="theme-color" content="#0a0a0c">
<title>Desk Deck</title>

<link rel="manifest" href="/runtime-static/manifest.webmanifest">
<link rel="icon" href="/runtime-static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/runtime-static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/runtime-static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/runtime-static/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/runtime-static/apple-touch-icon.png">

<link rel="stylesheet" href="/runtime-static/runtime.css">
</head>
<body>
  <header class="dd-titlebar" id="titlebar">
    <button class="dd-tb-menu" data-overlay="apps" title="All Apps">▦</button>
    <button class="dd-tb-menu" data-overlay="spaces" title="Spaces">▢▢</button>
    <button class="dd-tb-menu" data-overlay="bookmarks" title="Bookmarks">★</button>
    <div class="dd-tb-context" id="tb-context">
      <span class="dd-tb-name" id="tb-name">— · —</span>
      <span class="dd-tb-source" id="tb-source"></span>
    </div>
    <div class="dd-tb-status" id="tb-status">offline</div>
  </header>

  <main id="stage" class="dd-stage"></main>

  <div id="overlay" class="dd-overlay" hidden>
    <div class="dd-overlay-head">
      <span id="overlay-title">—</span>
      <button class="dd-overlay-close" id="overlay-close">×</button>
    </div>
    <div class="dd-overlay-body" id="overlay-body"></div>
  </div>

  <script type="module" src="/runtime-static/runtime.js"></script>
</body>
</html>
