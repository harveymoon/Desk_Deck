name: TouchDesigner
match:
  process: TouchDesigner.exe
canvas:
  width: 1600
  height: 1000
  theme: midnight
widgets:
  # ─── LEFT COLUMN (1/3 of canvas): status on top, console fills the rest ───

  - id: td_status
    type: textbox
    x: 24
    y: 24
    w: 512
    h: 44
    props:
      monospace: true
      max_lines: 1
      source: td_status

  - id: td_log
    type: textbox
    x: 24
    y: 84
    w: 512
    h: 892
    props:
      monospace: true
      max_lines: 600
      source: td_textport

  # ─── RIGHT COLUMN (2/3 of canvas): 4 quick buttons up top, par panel below ───

  - id: save
    type: button
    x: 560
    y: 24
    w: 240
    h: 96
    props:
      label: SAVE
      action: { type: hotkey, keys: ctrl+s }

  - id: perform
    type: button
    x: 812
    y: 24
    w: 240
    h: 96
    props:
      label: PERFORM
      action: { type: td_macro, name: perform_mode }

  - id: palette
    type: button
    x: 1064
    y: 24
    w: 240
    h: 96
    props:
      label: PALETTE
      action: { type: hotkey, keys: ctrl+shift+s }

  - id: textport
    type: button
    x: 1316
    y: 24
    w: 240
    h: 96
    props:
      label: TEXTPORT
      action: { type: hotkey, keys: alt+t }

  # Selection summary (one-liner: which op is being shown below).
  - id: td_sel
    type: textbox
    x: 560
    y: 132
    w: 808
    h: 40
    props:
      monospace: true
      max_lines: 1
      source: td_selected

  - id: td_help
    type: button
    x: 1380
    y: 132
    w: 86
    h: 40
    props:
      label: "?"
      action: { type: td_open_help }

  - id: td_help_py
    type: button
    x: 1470
    y: 132
    w: 86
    h: 40
    props:
      label: "PY?"
      action: { type: td_open_help, python: true }

  # Live par editor for whatever op is selected in TD. Pages render as
  # tabs, every par becomes an editable row.
  - id: td_pars
    type: param_panel
    x: 560
    y: 184
    w: 996
    h: 792
    props:
      action: { type: td_set_par }
