name: TouchDesigner
match:
  process: TouchDesigner.exe
canvas:
  width: 1600
  height: 1000
  theme: midnight
widgets:
  # ─── LEFT COLUMN: status bar on top, console fills the rest ───

  - id: td_status
    type: textbox
    x: 24
    y: 24
    w: 800
    h: 44
    props:
      monospace: true
      max_lines: 1
      source: td_status

  - id: td_log
    type: textbox
    x: 24
    y: 84
    w: 800
    h: 892
    props:
      monospace: true
      max_lines: 600
      source: td_textport

  # ─── RIGHT COLUMN: 4 quick buttons up top, par panel below ───

  - id: save
    type: button
    x: 848
    y: 24
    w: 174
    h: 96
    props:
      label: SAVE
      action: { type: hotkey, keys: ctrl+s }

  - id: perform
    type: button
    x: 1030
    y: 24
    w: 174
    h: 96
    props:
      label: PERFORM
      action: { type: td_macro, name: perform_mode }

  - id: palette
    type: button
    x: 1212
    y: 24
    w: 174
    h: 96
    props:
      label: PALETTE
      action: { type: hotkey, keys: ctrl+shift+s }

  - id: textport
    type: button
    x: 1394
    y: 24
    w: 174
    h: 96
    props:
      label: TEXTPORT
      action: { type: hotkey, keys: alt+t }

  # Selection summary (one-liner: which op is being shown below).
  - id: td_sel
    type: textbox
    x: 848
    y: 132
    w: 540
    h: 40
    props:
      monospace: true
      max_lines: 1
      source: td_selected

  - id: td_help
    type: button
    x: 1396
    y: 132
    w: 84
    h: 40
    props:
      label: HELP
      action: { type: td_open_help }

  - id: td_help_py
    type: button
    x: 1484
    y: 132
    w: 84
    h: 40
    props:
      label: PY
      action: { type: td_open_help, python: true }

  # Rollover one-liner (parameter / pargroup / page / op under the mouse).
  - id: td_rollover
    type: textbox
    x: 848
    y: 184
    w: 720
    h: 40
    props:
      monospace: true
      max_lines: 1
      source: td_rollover

  # Live par editor for whatever op is selected in TD. Pages render as
  # tabs, every par becomes an editable row. Mousing over a par in TD
  # highlights its row here.
  - id: td_pars
    type: param_panel
    x: 848
    y: 236
    w: 720
    h: 740
    props:
      action: { type: td_set_par }
