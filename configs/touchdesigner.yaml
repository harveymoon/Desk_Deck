name: TouchDesigner
match:
  process: TouchDesigner.exe
canvas:
  width: 1600
  height: 1000
  theme: midnight
widgets:
  # ─── Top hotkey row — all 180×100 ───
  - id: save
    type: button
    x: 40
    y: 24
    w: 180
    h: 100
    props:
      label: SAVE
      action: { type: hotkey, keys: ctrl+s }

  - id: perform
    type: button
    x: 240
    y: 24
    w: 180
    h: 100
    props:
      label: PERFORM
      action: { type: td_macro, name: perform_mode }

  - id: palette
    type: button
    x: 440
    y: 24
    w: 180
    h: 100
    props:
      label: PALETTE
      action: { type: hotkey, keys: ctrl+shift+s }

  - id: textport
    type: button
    x: 640
    y: 24
    w: 180
    h: 100
    props:
      label: TEXTPORT
      action: { type: hotkey, keys: alt+t }

  # ─── Live TD bridge (Desk_Deck.tox must be loaded + connected) ───

  - id: td_sel
    type: textbox
    x: 40
    y: 160
    w: 1080
    h: 48
    props:
      monospace: true
      max_lines: 2
      source: td_selected

  - id: td_help
    type: button
    x: 1140
    y: 160
    w: 200
    h: 48
    props:
      label: HELP
      action: { type: td_open_help }

  - id: td_help_py
    type: button
    x: 1356
    y: 160
    w: 200
    h: 48
    props:
      label: PY HELP
      action: { type: td_open_help, python: true }

  - id: td_rollover
    type: textbox
    x: 40
    y: 224
    w: 760
    h: 60
    props:
      monospace: true
      max_lines: 2
      source: td_rollover

  # Slider and toggle share the same slot. Only one is ever visible at a
  # time (server pushes hidden:true to whichever doesn't match the par
  # style under the mouse) so they don't overlap visually — the visible
  # one fills the whole rollover-control area.
  - id: td_rollover_drive
    type: slider
    x: 820
    y: 224
    w: 736
    h: 60
    props:
      label: VAL
      min: 0
      max: 1
      step: 0.001
      orientation: horizontal
      action: { type: td_set_par, path: "$rollover", par: "$rollover" }

  - id: td_rollover_toggle
    type: button
    x: 820
    y: 224
    w: 736
    h: 60
    props:
      label: "(no toggle)"
      action: { type: td_toggle_par }

  - id: td_status
    type: textbox
    x: 40
    y: 300
    w: 1516
    h: 40
    props:
      monospace: true
      max_lines: 1
      source: td_status

  - id: td_log
    type: textbox
    x: 40
    y: 356
    w: 1516
    h: 624
    props:
      monospace: true
      max_lines: 400
      source: td_textport
